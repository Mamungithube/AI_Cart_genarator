services:
  db:
    image: postgres:16-alpine
    container_name: drf_card_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-card_db}
      POSTGRES_USER: ${POSTGRES_USER:-card_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-card_secure_password_123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - card_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-card_user} -d ${POSTGRES_DB:-card_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: drf_card_web
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      db:
        condition: service_healthy
    networks:
      - card_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: drf_card_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - card_network

networks:
  card_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local
